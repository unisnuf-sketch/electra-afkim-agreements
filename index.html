<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הסכמים קיבוציים · אלקטרה אפיקים תחבורה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&family=Heebo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1A1420;
    --panel:#2A1F30;
    --paper:#F3EFE4;
    --paper-dim:#E4DFCF;
    --signal:#D81E25;
    --signal-dim:#A8171D;
    --rust:#601C60;
    --steel:#8A93A3;
    --line: rgba(243,239,228,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:'Heebo',sans-serif;
    min-height:100vh;
    padding:0 0 64px;
  }
  a{color:inherit;}

  .board{
    max-width:820px;
    margin:0 auto;
    padding:0 20px;
  }

  .logo{
    height:64px;
    width:auto;
    margin-bottom:28px;
  }
  header{
    padding:56px 20px 40px;
    text-align:center;
    border-bottom:1px solid var(--line);
  }
  .eyebrow{
    font-family:'Heebo',sans-serif;
    font-size:13px;
    font-weight:600;
    letter-spacing:0.08em;
    color:var(--signal);
    text-transform:uppercase;
    margin-bottom:14px;
  }
  h1{
    font-family:'Rubik',sans-serif;
    font-weight:900;
    font-size:clamp(30px,6vw,46px);
    margin:0 0 12px;
    letter-spacing:-0.01em;
  }
  .sub{
    color:var(--steel);
    font-size:16px;
    max-width:520px;
    margin:0 auto;
    line-height:1.6;
  }

  .years{
    margin-top:8px;
  }

  .year-row{
    display:flex;
    gap:20px;
    align-items:flex-start;
    padding:28px 0;
    border-bottom:1px solid var(--line);
    opacity:0;
    animation:flip-in 0.5s ease forwards;
  }
  .year-row:nth-child(1){animation-delay:0.05s;}
  .year-row:nth-child(2){animation-delay:0.15s;}
  .year-row:nth-child(3){animation-delay:0.25s;}
  .year-row:nth-child(4){animation-delay:0.35s;}

  @keyframes flip-in{
    from{opacity:0; transform:translateY(-6px) scaleY(0.94); }
    to{opacity:1; transform:translateY(0) scaleY(1);}
  }
  @media (prefers-reduced-motion: reduce){
    .year-row{animation:none; opacity:1;}
  }

  .year-badge{
    flex:0 0 auto;
    width:84px;
    height:84px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Rubik',sans-serif;
    font-weight:900;
    font-size:22px;
    color:var(--paper);
    position:relative;
  }
  .year-row.latest .year-badge{
    background:var(--signal);
    color:#fff;
    border-color:var(--signal);
  }
  .year-badge::before{
    content:"";
    position:absolute;
    top:50%; right:8px; left:8px;
    height:1px;
    background:currentColor;
    opacity:0.15;
  }

  .docs{
    flex:1 1 auto;
    display:flex;
    flex-direction:column;
    gap:8px;
  }

  .doc-link{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:13px 16px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    text-decoration:none;
    transition:border-color .15s ease, background .15s ease, transform .1s ease;
  }
  .doc-link:hover{
    border-color:var(--signal-dim);
    background:#242E3B;
    transform:translateX(-2px);
  }
  .doc-link:active{ transform:translateX(0); }

  .doc-info{
    display:flex;
    align-items:baseline;
    gap:10px;
    flex-wrap:wrap;
  }
  .doc-name{
    font-weight:500;
    font-size:15px;
  }
  .doc-lang{
    font-size:12px;
    font-weight:600;
    color:var(--steel);
    background:rgba(138,147,163,0.12);
    padding:2px 8px;
    border-radius:999px;
    white-space:nowrap;
  }
  .doc-go{
    font-family:'Rubik',sans-serif;
    font-size:13px;
    font-weight:700;
    color:var(--signal);
    white-space:nowrap;
    flex:0 0 auto;
  }

  footer{
    text-align:center;
    color:var(--steel);
    font-size:13px;
    margin-top:48px;
    padding:0 20px;
  }
</style>
</head>
